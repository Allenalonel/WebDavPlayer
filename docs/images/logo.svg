<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="128" height="128">
  <defs>
    <!-- MD3 Radial Gradient (Centered 54, 54) -->
    <radialGradient id="logoBg" cx="50%" cy="50%" r="68%">
      <stop offset="0%" stop-color="#24143D" />
      <stop offset="60%" stop-color="#140A24" />
      <stop offset="100%" stop-color="#07030C" />
    </radialGradient>
    <!-- MD3 Continuous Squircle Mask -->
    <clipPath id="squircleMask">
      <rect width="108" height="108" rx="24" ry="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleMask)">
    <!-- Background Layer -->
    <rect width="108" height="108" fill="url(#logoBg)" />

    <!-- Foreground: 4 Equalizer Columns natural Play Arrow -->
    <g transform="translate(0, 0)">
      <rect x="38" y="32" width="5.5" height="44" rx="2.75" fill="#CCC2DC" />
      <rect x="47" y="38" width="5.5" height="32" rx="2.75" fill="#D0BCFF" />
      <rect x="56" y="44" width="5.5" height="20" rx="2.75" fill="#EFB8C8" />
      <rect x="65" y="50" width="5.5" height="8" rx="2.75" fill="#FFFFFF" />

      <!-- Bottom Fluid Shelf -->
      <path d="M34,79 h38 a2.5,2.5 0 0,1 0,5 h-38 a2.5,2.5 0 0,1 0,-5 z" fill="#4F378B" opacity="0.75" />
    </g>
  </g>
</svg>
